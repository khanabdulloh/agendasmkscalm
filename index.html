['06-21','06-25','penerimaan',['Pengumuman & Daftar Ulang Siswa Baru','New Student Announcement & Re-registration'],['Penetapan dan daftar ulang peserta didik baru.','Announcement of accepted students and re-registration.'],'sec','spmb'],
['06-26','','ortu',['Pembagian Rapor & Rapat Akhir Tahun','Report Cards & Year-End Meeting'],['Evaluasi tahun pelajaran bersama orang tua dan komite sekolah.','Year review with parents and the school committee.'],'hall','kep']
];
var BL=[['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'],['January','February','March','April','May','June','July','August','September','October','November','December']],
BS=[['JAN','FEB','MAR','APR','MEI','JUN','JUL','AGU','SEP','OKT','NOV','DES'],['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC']];
var T=new Date();T.setHours(0,0,0,0);
var SY=T.getMonth()>=6?T.getFullYear():T.getFullYear()-1;
function D(md,sy){var a=md.split('-'),m=+a[0];return new Date(m>=7?sy:sy+1,m-1,+a[1])}
function build(sy){return EV.map(function(e){return {e:e,s:D(e[0],sy),f:e[1]?D(e[1],sy):D(e[0],sy)}}).sort(function(a,b){return a.s-b.s})}
var CY=build(SY),NY=build(SY+1);
var u=function(k){return U[k][L]};
function fmt(d){return L?BL[1][d.getMonth()]+' '+d.getDate():d.getDate()+' '+BL[0][d.getMonth()]}

function render(){
 $('cxEy').textContent=u('ey');$('cxH').innerHTML=u('h');$('cxP').textContent=u('p');
 $('cxH1').textContent=u('h1');$('cxH2').textContent=u('h2');$('cxNt').textContent=u('nt');
 $('cxT1').textContent=u('t1');$('cxT2').textContent=u('t2');$('cxA1').textContent=u('a1');
 [].forEach.call($('cxLg').children,function(b){b.className=(+b.getAttribute('data-l')===L)?'on':''});
 var cnt=function(c){return EV.filter(function(e){return e[2]===c}).length};
 var sv=[EV.length,cnt('akademik'),cnt('ortu'),cnt('penerimaan')];
 $('cxS').innerHTML=U.s.map(function(x,i){return '<div><b>'+sv[i]+'</b><span>'+x[L]+'</span></div>'}).join('');
 /* agenda terdekat */
 var nx=CY.concat(NY).filter(function(x){return x.f>=T&&x.e[3][0].indexOf('Libur')<0})[0];
 if(nx){var run=nx.s<=T,d=Math.round((nx.s-T)/864e5);
  $('cxN').style.display='';
  $('cxN').innerHTML='<div><small>'+u(run?'run':'nx')+'</small><h3>'+nx.e[3][L]+'</h3><p>'+fmt(nx.s)+' · '+LC[nx.e[5]][L]+'</p></div><div class="cx-cd"><b>'+(run?u('today'):d)+'</b><span>'+u(run?'act':'dl')+'</span></div>';
 }else $('cxN').style.display='none';
 $('cxR').innerHTML=RT.map(function(r){return '<div class="cx-r"><time>'+r[0][L]+'<em>'+r[1][L]+'</em></time><div><b>'+r[2][L]+'</b><span>'+r[3][L]+'</span></div></div>'}).join('');
 /* filter */
 var cb='<button data-c="all"'+(fc==='all'?' class="on"':'')+'>'+u('all')+'</button>';
 for(var k in CAT)cb+='<button data-c="'+k+'"'+(fc===k?' class="on"':'')+'>'+CAT[k][0][L]+'</button>';
 $('cxC').innerHTML=cb;
 $('cxM').innerHTML=[['all','yr'],['g','od'],['e','ev']].map(function(x){return '<button data-s="'+x[0]+'"'+(fs===x[0]?' class="on"':'')+'>'+u(x[1])+'</button>'}).join('');
 $('cxG').innerHTML=Object.keys(CAT).map(function(k){return '<span><i class="cx-dot" style="background:'+CAT[k][1]+'"></i>'+CAT[k][0][L]+'</span>'}).join('');
 /* kalender */
 var g={},o=[];
 CY.forEach(function(x){
  var e=x.e,m=x.s.getMonth(),odd=m>=6;
  if(fc!=='all'&&e[2]!==fc)return;
  if(fs==='g'&&!odd)return;if(fs==='e'&&odd)return;
  if(!g[m]){g[m]=[];o.push(m)}g[m].push(x);
 });
 $('cxL').innerHTML=o.length?o.map(function(m){
  var now=m===T.getMonth();
  return '<section class="cx-mo'+(now?' now':'')+'"><h4>'+BL[L][m]+'<small>'+u(m>=6?'so':'se')+'</small>'+(now?'<em>'+u('nw')+'</em>':'')+'</h4><div>'+g[m].map(function(x){
   var e=x.e,s=x.s,f=x.f,past=f<T,run=s<=T&&f>=T,seg=!past&&!run&&(s-T)/864e5<=14;
   var dt=e[1]?'<i>'+u('to')+' '+f.getDate()+' '+BS[L][f.getMonth()]+'</i>':'';
   var bd=run?'<span class="cx-bd ber">'+u('b1')+'</span>':seg?'<span class="cx-bd seg">'+u('b2')+'</span>':past?'<span class="cx-bd">'+u('b3')+'</span>':'';
   var meta=e[5]==='none'?'':'<div class="cx-m"><span>'+LC[e[5]][L]+'</span><span>'+PC[e[6]][L]+'</span></div>';
   return '<article class="cx-e'+(past?' past':'')+'"><div class="cx-d"><b>'+s.getDate()+'</b><span>'+BS[L][s.getMonth()]+'</span>'+dt+'</div><div><div class="cx-t"><i class="cx-dot" style="background:'+CAT[e[2]][1]+'"></i><h5>'+e[3][L]+'</h5>'+bd+'</div><p>'+e[4][L]+'</p>'+meta+'</div></article>'
  }).join('')+'</div></section>'}).join(''):'<p style="padding:40px 0;color:#6a7590">'+u('em')+'</p>';
}
$('cxLg').onclick=function(e){var b=e.target.getAttribute('data-l');if(b===null)return;L=+b;render()};
$('cxC').onclick=function(e){var c=e.target.getAttribute('data-c');if(c===null)return;fc=c;render()};
$('cxM').onclick=function(e){var s=e.target.getAttribute('data-s');if(s===null)return;fs=s;render()};
render();
})();
</script>
